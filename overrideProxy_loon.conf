# Loon 本地覆写模板（建议保存在本地，不要提交到公开仓库）
# 用途：仅替换 `[Remote Proxy]` 中 fastfly 的订阅地址，避免在主配置里暴露。
# 使用步骤：
# 1) 复制本文件为 override.loon.conf（或任意本地文件名）。
# 2) 将占位符 URL 换成你的真实订阅地址。
# 3) Loon → 配置 → 订阅 → 选中主配置（foreverchen9_loon.conf）→ 关联/导入此本地覆写 → 保存并刷新。
# 4) 刷新节点后，延迟测试确认生效。仅本地生效，不会回传到仓库。

[Remote Proxy]
fastfly = https://example.invalid/replace-with-your-private-subscription-url,udp=true,block-quic=false,fast-open=default,skip-cert-verify=true,enabled=true,vmess-aead=true,flexible-sni=false

# 如果合并不生效，可用完全替换模式（需补全字段）。取消注释后生效：
# [Remote Proxy]
# fastfly = #!replace https://example.invalid/replace-with-your-private-subscription-url,udp=true,block-quic=false,fast-open=default,skip-cert-verify=true,enabled=true,vmess-aead=true,flexible-sni=false
