port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: error
external-controller: :9090
proxy-providers:
  fastfly:
    type: http
    interval: 86400
    # 注：为避免泄露订阅信息，此处仅为占位符；请在客户端本地覆盖为你的真实订阅地址
    url: https://example.invalid/replace-with-your-private-subscription-url
    benchmark-url: http://cp.cloudflare.com/generate_204
dns:
  enable: true
  ipv6: true
  listen: 0.0.0.0:53
  default-nameserver:
    - 223.6.6.6
    - 223.5.5.5
    - 8.8.8.8
    - 1.1.1.1
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - localhost.ptlogin2.qq.com
    - +.srv.nintendo.net
    - +.stun.playstation.net
    - +.msftconnecttest.com
    - +.msftncsi.com
    - +.xboxlive.com
    - msftconnecttest.com
    - xbox.*.microsoft.com
    - '*.battlenet.com.cn'
    - '*.battlenet.com'
    - '*.blzstatic.cn'
    - '*.battle.net'
  nameserver:
    - 223.6.6.6
    - 223.5.5.5
    - 8.8.8.8
    - 1.1.1.1
proxies: []
proxy-groups:
  - name: 节点选择
    type: select
    proxies:
      - 自动选择
      - 香港节点
      - 台湾节点
      - 狮城节点
      - 日本节点
      - 韩国节点
      - 美国节点
      - 其他节点
      - 手动切换
      - DIRECT
    icon: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/icon/qure/color/Rocket.png
  - name: 手动切换
    type: select
    proxies: []
    use:
      - fastfly
    icon: https://raw.githubusercontent.com/Semporia/Hand-Painted-icon/master/Universal/Available.png
    filter: ^((?!套餐|到期|余额|剩余|流量|官网).)*$
  - name: 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies: []
    use:
      - fastfly
    icon: https://raw.githubusercontent.com/Semporia/Hand-Painted-icon/master/Universal/Auto_Speed.png
