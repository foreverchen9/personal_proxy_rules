[Remote Filter]
ALL_Filter = NameRegex, FilterKey = ".*"
HK_Filter = NameRegex, FilterKey = "(?i)(🇭🇰|港|香港|HK|Hong)"
TW_Filter = NameRegex, FilterKey = "(?i)(🇹🇼|🇨🇳|台|台湾|TW|Tai)"
JP_Filter = NameRegex, FilterKey = "(?i)(🇯🇵|日|日本|JP|Japan)"
KR_Filter = NameRegex, FilterKey = "(?i)(🇰🇷|韩|韩国|KR|KOR|Korea)"
US_Filter = NameRegex, FilterKey = "(?i)(🇺🇸|美|美国|US|States|American)"
SG_Filter = NameRegex, FilterKey = "(?i)(🇸🇬|坡|新加坡|狮城|SG|Singapore)"
UK_Filter = NameRegex, FilterKey = "(?i)(🇬🇧|英国|英|英格兰|UK|United Kingdom)"
Others_Filter = NameRegex, FilterKey = "^((?!套餐|到期|余额|剩余|流量|官网|🇭🇰|港|香港|HK|Hong|🇹🇼|🇨🇳|台|台湾|TW|Tai|🇯🇵|日|日本|JP|Japan|🇸🇬|坡|新加坡|狮城|SG|Singapore|🇰🇷|韩|韩国|KR|KOR|Korea|🇺🇸|美|美国|US|States|American|🇬🇧|英国|英|英格兰|UK|United Kingdom).)*$"

