# ForeverChen9 代理配置文件 - 增强版本
# 支持rule-providers的现代化配置

port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
allow-lan: false
bind-address: '*'
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
external-ui: ui

# Clash Verge 特殊配置
profile:
  store-selected: true
  store-fake-ip: true

# 实验性功能
experimental:
  ignore-resolve-fail: true
  sniff-tls-sni: true

# DNS配置
dns:
    enable: true
    ipv6: false
    default-nameserver: [223.5.5.5, 119.29.29.29]
    enhanced-mode: fake-ip
    fake-ip-range: 198.18.0.1/16
    use-hosts: true
    fake-ip-filter:
    nameserver: ['https://doh.pub/dns-query', 'https://dns.alidns.com/dns-query']
    fallback: ['https://doh.dns.sb/dns-query', 'https://dns.cloudflare.com/dns-query', 'https://dns.twnic.tw/dns-query', 'tls://8.8.4.4:853', 223.5.5.5]
    fallback-filter: { geoip: true, ipcidr: [240.0.0.0/4, 0.0.0.0/32] }

# 代理节点
proxies: 
  -
    name: 🇺🇸家宽

# 代理提供商配置
proxy-providers:
  fastfly:
    # 注：为避免泄露订阅信息，此处仅为占位符。
    # 请在 Clash Verge 中通过本地 Mixin 覆盖如下 url 字段为你的真实订阅地址。
    type: http
    interval: 86400
    url: https://example.invalid/replace-with-your-private-subscription-url
    # path: ./providers/fastfly.yaml
    benchmark-url: http://cp.cloudflare.com/generate_204
    health-check:
      enable: true
      interval: 600
      url: http://cp.cloudflare.com/generate_204

# 代理组配置
proxy-groups:
  # 主选择器
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - 🇭🇰 香港节点
      - 🇯🇵 日本节点
      - 🇸🇬 狮城节点
      - 🇹🇼 台湾节点
      - 🇺🇸 美国节点
      - 🇰🇷 韩国节点
      - 🌍 其他节点
      - DIRECT
      - 🇺🇸家宽
    icon: https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/icon/qure/color/Rocket.png

  # 应用特定代理组
